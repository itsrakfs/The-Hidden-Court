name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "build_pages.py"
      - "static/**"
      - "templates/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build static site
        run: |
          python build_pages.py \
            --api-base "${{ vars.TH_API_BASE || 'https://thehiddencourt.fun' }}"

      - uses: actions/configure-pages@v5
        with:
          static_site_generator: ""

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
